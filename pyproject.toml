[project]
name = "secop-mcp-server"
version = "0.3.0"
description = "MCP Server para consultar contratación pública de Colombia (SECOP I y II)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Juan Sebastián Erna" }]
keywords = ["mcp", "secop", "colombia", "contratacion-publica", "datos-abiertos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
secop-mcp = "secop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secop_mcp"]

[project.urls]
Repository = "https://github.com/juandavidsernav/secop-mcp-server"
Issues = "https://github.com/juandavidsernav/secop-mcp-server/issues"
